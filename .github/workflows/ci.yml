name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET 8 SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore Dependencies
      run: dotnet restore src/WorldState.sln

    - name: Build Solution (Release)
      run: dotnet build src/WorldState.sln -c Release --no-restore /p:TreatWarningsAsErrors=true

    - name: Run Domain Automated Tests
      run: dotnet test src/WorldState.sln -c Release --no-build --verbosity normal

    - name: Run Content Validator
      run: dotnet run --project tools/ContentValidator/ContentValidator.csproj -c Release --no-build
